name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '永兴涂料Android工程-1.3.0.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q '永兴涂料Android工程-1.3.0.zip' -d source
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - run: flutter create . --platforms=android --project-name=yongxing_coatings_mobile
        working-directory: source
      - run: sed -i '/<manifest /a\\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        working-directory: source
      - run: rm -f test/widget_test.dart
        working-directory: source
      - run: flutter pub get
        working-directory: source
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: source
      - run: flutter analyze
        working-directory: source
      - run: flutter test
        working-directory: source
      - run: flutter build apk --release
        working-directory: source
      - uses: actions/upload-artifact@v4
        with:
          name: yongxing-coatings-android-1.3.0-visual-check
          path: source/build/visual/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: yongxing-coatings-android-1.3.0
          path: source/build/app/outputs/flutter-apk/app-release.apk
